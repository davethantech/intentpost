name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intentpost
          POSTGRES_PASSWORD: intentpost
          POSTGRES_DB: intentpost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intentpost -d intentpost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://intentpost:intentpost@127.0.0.1:5432/intentpost
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123456
      CORS_ORIGINS: http://localhost:3000
      WEBHOOK_SECRET_DEFAULT: ci-webhook-secret-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run migrate
      - run: npm test
